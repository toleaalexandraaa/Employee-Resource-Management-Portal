<div class="tab-content">
  <div *ngIf="loading" class="spinner-wrap">
    <mat-spinner diameter="40"></mat-spinner>
  </div>

  <div *ngIf="error" class="error-wrap">
    <mat-icon color="warn">error_outline</mat-icon>
    <p>Failed to load workforce data.</p>
  </div>

  <div *ngIf="!loading && !error && data" class="charts-grid">
    <mat-card class="chart-card">
      <mat-card-header>
        <mat-card-title>{{ 'HR.EMPLOYEES' | translate }} by Department</mat-card-title>
      </mat-card-header>
      <mat-card-content class="chart-content">
        <canvas #deptCanvas></canvas>
      </mat-card-content>
    </mat-card>

    <mat-card class="chart-card">
      <mat-card-header>
        <mat-card-title>Contract Types</mat-card-title>
      </mat-card-header>
      <mat-card-content class="chart-content">
        <canvas #contractCanvas></canvas>
      </mat-card-content>
    </mat-card>

    <mat-card class="chart-card">
      <mat-card-header>
        <mat-card-title>{{ 'HR.SENIORITY' | translate }} Distribution</mat-card-title>
      </mat-card-header>
      <mat-card-content class="chart-content">
        <canvas #seniorityCanvas></canvas>
      </mat-card-content>
    </mat-card>

    <mat-card class="chart-card">
      <mat-card-header>
        <mat-card-title>Hiring Trend — Last 24 Months</mat-card-title>
      </mat-card-header>
      <mat-card-content class="chart-content">
        <canvas #hiresCanvas></canvas>
      </mat-card-content>
    </mat-card>
  </div>
</div>
