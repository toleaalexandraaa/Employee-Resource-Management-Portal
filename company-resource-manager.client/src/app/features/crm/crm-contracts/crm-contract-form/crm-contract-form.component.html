<app-page-header [title]="'CRM.NEW_CONTRACT' | translate"></app-page-header>
<mat-card>
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Client ID</mat-label>
          <input matInput formControlName="clientId" [placeholder]="'PROJECTS.CLIENT' | translate" />
          <mat-error>{{ 'COMMON.REQUIRED' | translate }}</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline" style="flex:2">
          <mat-label>Title</mat-label>
          <input matInput formControlName="title" />
          <mat-error>{{ 'COMMON.REQUIRED' | translate }}</mat-error>
        </mat-form-field>
      </div>
      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>{{ 'CRM.CONTRACT_VALUE' | translate }}</mat-label>
          <input matInput type="number" formControlName="value" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Currency</mat-label>
          <input matInput formControlName="currency" />
        </mat-form-field>
      </div>
      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>{{ 'CRM.START_DATE' | translate }}</mat-label>
          <input matInput [matDatepicker]="startPicker" formControlName="startDate" />
          <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
          <mat-datepicker #startPicker></mat-datepicker>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>{{ 'CRM.END_DATE' | translate }}</mat-label>
          <input matInput [matDatepicker]="endPicker" formControlName="endDate" />
          <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
          <mat-datepicker #endPicker></mat-datepicker>
        </mat-form-field>
      </div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button mat-flat-button color="primary" type="submit" [disabled]="loading">
          {{ 'COMMON.CREATE' | translate }}
        </button>
        <button mat-button type="button" routerLink="/crm/contracts">{{ 'COMMON.CANCEL' | translate }}</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
